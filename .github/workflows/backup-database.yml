name: Database & Storage Backup

# Not yet enabled: this workflow has not been pushed to the repository
# and no scheduled run has ever executed. It is implemented here so
# that once secrets are configured and the file is committed/pushed,
# activation is a one-line change (uncomment the `schedule` trigger)
# rather than new engineering. See docs/DISASTER_RECOVERY.md for the
# exact list of repository secrets this workflow requires and the
# manual steps still needed before it can be considered active.
#
# on:
#   schedule:
#     - cron: "0 3 * * *"   # 03:00 UTC daily
#   workflow_dispatch: {}

on:
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run backup (database + storage)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: npm run backup:all
