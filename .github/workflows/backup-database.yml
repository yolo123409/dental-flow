name: Database & Storage Backup

# Activated (see docs/DISASTER_RECOVERY.md for the full runbook). Runs
# the existing, already-verified backup:all pipeline (database +
# storage, read-only against production, upload-verified against R2)
# on a daily schedule, plus on-demand via workflow_dispatch.
#
# concurrency prevents two backup runs from ever overlapping: a second
# trigger while one is in progress queues behind it rather than running
# in parallel or cancelling the in-progress run (cancel-in-progress:
# false), so a backup is never interrupted mid-write.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: database-storage-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (not 20): scripts/backup/backup-storage.mjs uses the
          # @supabase/supabase-js admin client, whose realtime-js
          # dependency requires a native WebSocket global. Node 22 has
          # this on by default; Node 20 does not. This is a workflow
          # runtime version bump only - it does not affect the deployed
          # application's runtime (no package.json "engines" field
          # pins a Node version, and this is the only workflow file in
          # the repo).
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run backup (database + storage)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Required by scripts/backup/check-config.mjs's preflight
          # (run:all's first step) even though the backup itself never
          # touches this project - it validates RESTORE_TEST_DB_URL is
          # present and, live, a genuinely different Postgres cluster
          # than SUPABASE_DB_URL before proceeding.
          RESTORE_TEST_DB_URL: ${{ secrets.RESTORE_TEST_DB_URL }}
          # The restore-test project's Supabase URL (distinct from its
          # pooler connection string above). Session/Transaction pooler
          # hostnames are region-based and don't contain the project
          # ref, so project identity is established from this URL, not
          # from the pooler hostname.
          RESTORE_TEST_SUPABASE_URL: ${{ secrets.RESTORE_TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: npm run backup:all

      - name: Apply retention policy (30 daily / 12 weekly / 12 monthly)
        if: success()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: npm run backup:retention -- --execute
